name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Tests (Headless Linux)
        # xvfb-run provides a virtual display buffer so the VS Code Extension Host
        # can launch Chromium successfully on a Linux server.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm test
